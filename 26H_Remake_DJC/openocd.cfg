# OpenOCD configuration for DJI RoboMaster C board / STM32F407IGH6

source [find interface/stlink.cfg]
transport select swd

# Unit: kHz. OpenOCD expects a plain number here, not "5000kHz".
adapter speed 5000

# STM32F407 uses the generic STM32F4 target script shipped with OpenOCD.
source [find target/stm32f4x.cfg]
